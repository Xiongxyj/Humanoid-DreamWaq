[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "humanoid-dreamwaq"
version = "0.1.0"
description = "DreamWaQ-style blind locomotion for Unitree G1 in Isaac Lab"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = ["rsl-rl-lib==5.0.1"]

[project.urls]
Repository = "https://github.com/Xiongxyj/Humanoid-DreamWaq"

[tool.setuptools.packages.find]
where = ["src"]
